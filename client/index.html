<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LangWar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <nav id="menu" hidden>
      <h1 class="logo">LangWar</h1>
      <div class="player">
        <strong id="player-name"></strong>
        <div>💰 <span id="player-gold"></span></div>
      </div>
      <a href="#/profil" data-screen="profil">🧙 Postava</a>
      <a href="#/krcma" data-screen="krcma">🍺 Krčma</a>
      <a href="#/arena" data-screen="arena">⚔️ Aréna</a>
      <a href="#/obchod" data-screen="obchod">🛒 Obchod</a>
      <a href="#/ukoly" data-screen="ukoly">📋 Denní úkoly <span id="daily-badge" class="badge" hidden></span></a>
      <a href="#/cech" data-screen="cech">🏰 Cech <span id="guild-badge" class="badge" hidden></span></a>
      <a href="#/hospoda" data-screen="hospoda">💬 Hospoda <span id="chat-badge" class="badge" hidden></span></a>
      <a href="#/slava" data-screen="slava">🏆 Síň slávy</a>
      <div class="menu-bottom">
        <button type="button" id="logout" class="link-btn">🚪 Odhlásit</button>
        <div id="server-status" class="status">Server: ověřuji…</div>
      </div>
    </nav>
    <main id="screen"></main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
